<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="title description">
  <title id="title">Leitura comentada do gráfico da questão 142</title>
  <desc id="description">A frequência respiratória fica em f um até t um. Entre t um e t dois, a curva desce. Depois de t dois, a linha é horizontal no nível f dois, indicando frequência constante.</desc>
  <rect x="1" y="1" width="858" height="438" rx="18" fill="#FBFCFB" stroke="#D9E7E3" stroke-width="2"/>
  <text x="34" y="42" fill="#24383A" font-family="Arial, sans-serif" font-size="23" font-weight="700">Acompanhe a direção da linha</text>
  <text x="34" y="68" fill="#687679" font-family="Arial, sans-serif" font-size="14">A pergunta começa em t₁, quando a prática meditativa se inicia.</text>

  <rect x="325" y="104" width="250" height="210" fill="#FFF0EF"/>
  <line x1="90" y1="160" x2="325" y2="160" stroke="#C7D2D1" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="90" y1="255" x2="575" y2="255" stroke="#C7D2D1" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="325" y1="160" x2="325" y2="315" stroke="#E9B8B6" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="575" y1="255" x2="575" y2="315" stroke="#AFCBEE" stroke-width="2" stroke-dasharray="5 5"/>

  <path d="M90 105 V315 H790" fill="none" stroke="#253D3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M90 105 L84 117 M90 105 L96 117 M790 315 L778 309 M790 315 L778 321" fill="none" stroke="#253D3F" stroke-width="3" stroke-linecap="round"/>

  <path d="M92 160 H325" fill="none" stroke="#82989A" stroke-width="7" stroke-linecap="round"/>
  <path d="M325 160 C412 160 422 255 575 255" fill="none" stroke="#E53935" stroke-width="8" stroke-linecap="round"/>
  <path d="M575 255 H752" fill="none" stroke="#147BDE" stroke-width="8" stroke-linecap="round"/>
  <circle cx="325" cy="160" r="7" fill="#FFFFFF" stroke="#E53935" stroke-width="4"/>
  <circle cx="575" cy="255" r="7" fill="#FFFFFF" stroke="#147BDE" stroke-width="4"/>

  <g fill="#253D3F" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="62" y="165">f₁</text>
    <text x="62" y="260">f₂</text>
    <text x="315" y="340">t₁</text>
    <text x="565" y="340">t₂</text>
  </g>
  <text x="285" y="358" fill="#687679" font-family="Arial, sans-serif" font-size="12">início</text>
  <text x="530" y="358" fill="#687679" font-family="Arial, sans-serif" font-size="12">estabiliza</text>
  <text x="691" y="345" fill="#253D3F" font-family="Arial, sans-serif" font-size="14" font-weight="700">Tempo (min)</text>
  <text transform="translate(30 298) rotate(-90)" fill="#253D3F" font-family="Arial, sans-serif" font-size="14" font-weight="700">Frequência respiratória (rpm)</text>

  <line x1="205" y1="400" x2="250" y2="400" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  <text x="261" y="405" fill="#B42D2B" font-family="Arial, sans-serif" font-size="14" font-weight="700">diminui entre t₁ e t₂</text>
  <line x1="486" y1="400" x2="531" y2="400" stroke="#147BDE" stroke-width="7" stroke-linecap="round"/>
  <text x="542" y="405" fill="#0B5CB0" font-family="Arial, sans-serif" font-size="14" font-weight="700">constante após t₂</text>
</svg>
