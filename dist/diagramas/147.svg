<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" role="img" aria-labelledby="title description">
  <title id="title">Diagonal do quadrado na questão 147</title>
  <desc id="description">No plano cartesiano, o quadrado tem vértices T, U, V e S. A diagonal de U até S está destacada em laranja. Da esquerda para a direita, ela desce: x aumenta e y diminui.</desc>
  <rect x="1" y="1" width="858" height="528" rx="18" fill="#FBFCFB" stroke="#D9E7E3" stroke-width="2"/>
  <text x="32" y="41" fill="#24383A" font-family="Arial, sans-serif" font-size="23" font-weight="700">Siga a diagonal que passa por S</text>
  <text x="32" y="68" fill="#687679" font-family="Arial, sans-serif" font-size="15">Nela, o herói fica à mesma distância dos dois vilões, T e V.</text>

  <g transform="translate(0 65)">
  <g stroke="#E3EBE9" stroke-width="1">
    <path d="M320 88 V385 M400 88 V385 M480 88 V385 M560 88 V385 M240 305 H610 M240 225 H610 M240 145 H610"/>
  </g>
  <path d="M240 84 V385 H625" fill="none" stroke="#294344" stroke-width="3" stroke-linecap="round"/>
  <path d="M240 84 l-6 12 m6 -12 l6 12 M625 385 l-12 -6 m12 6 l-12 6" fill="none" stroke="#294344" stroke-width="3"/>
  <g fill="#516668" font-family="Arial, sans-serif" font-size="15">
    <text x="227" y="406">0</text><text x="313" y="406">2</text><text x="393" y="406">4</text><text x="473" y="406">6</text><text x="553" y="406">8</text>
    <text x="215" y="310">2</text><text x="215" y="230">4</text><text x="215" y="150">6</text><text x="215" y="70">8</text>
  </g>
  <text x="634" y="390" fill="#294344" font-family="Arial, sans-serif" font-size="19" font-weight="700">x</text>
  <text x="253" y="91" fill="#294344" font-family="Arial, sans-serif" font-size="19" font-weight="700">y</text>

  <polygon points="320,225 400,65 560,145 480,305" fill="#D9F1FA" stroke="#4D9FC4" stroke-width="3"/>
  <path d="M400 65 L480 305" fill="none" stroke="#F06423" stroke-width="8" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#174C5B" stroke-width="3">
    <circle cx="320" cy="225" r="8"/><circle cx="400" cy="65" r="8"/><circle cx="560" cy="145" r="8"/><circle cx="480" cy="305" r="8"/>
  </g>
  <g fill="#24383A" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="284" y="222">T</text><text x="402" y="55">U</text><text x="573" y="148">V (8, 6)</text><text x="490" y="325">S (6, 2)</text>
  </g>
  <rect x="640" y="194" width="186" height="104" rx="12" fill="#FFF1E8" stroke="#F5C3A5"/>
  <text x="657" y="224" fill="#9C4319" font-family="Arial, sans-serif" font-size="17" font-weight="700">Na diagonal:</text>
  <text x="657" y="251" fill="#294344" font-family="Arial, sans-serif" font-size="16">x aumenta →</text>
  <text x="657" y="278" fill="#294344" font-family="Arial, sans-serif" font-size="16">y diminui ↓</text>
  </g>
</svg>
