<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="title description">
  <title id="title">Exemplo visual de desvio padrão na questão 157</title>
  <desc id="description">Dois exemplos fictícios com onze pontos cada e média de 25 anos. No primeiro, os pontos ficam espalhados entre 15 e 35 anos, ilustrando desvio padrão 10. No segundo, os pontos ficam concentrados entre 23 e 27 anos, ilustrando desvio padrão 1. A faixa de 20 a 30 anos está sombreada. Os pontos não representam as idades reais das participantes.</desc>
  <rect x="1" y="1" width="858" height="518" rx="18" fill="#FBFCFB" stroke="#D9E7E3" stroke-width="2"/>
  <text x="28" y="39" fill="#24383A" font-family="Arial, sans-serif" font-size="23" font-weight="700">Mesma média, espalhamentos diferentes</text>
  <text x="28" y="66" fill="#687679" font-family="Arial, sans-serif" font-size="15">Exemplo ilustrativo: cada ponto é uma pessoa hipotética. A faixa sombreada vai de 20 a 30 anos.</text>

  <rect x="35" y="111" width="790" height="142" rx="12" fill="#FFFFFF" stroke="#D9E7E3" stroke-width="2"/>
  <rect x="35" y="270" width="790" height="147" rx="12" fill="#FFFFFF" stroke="#D9E7E3" stroke-width="2"/>
  <rect x="290" y="113" width="200" height="138" fill="#E5F3EF"/>
  <rect x="290" y="272" width="200" height="143" fill="#E5F3EF"/>
  <path d="M390 108 V417" stroke="#218278" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="298" y="100" fill="#218278" font-family="Arial, sans-serif" font-size="14" font-weight="700">faixa pedida: 20 a 30 anos</text>

  <g fill="#24383A" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="54" y="148">Grupo 1</text>
    <text x="54" y="307">Grupo 4</text>
  </g>
  <g fill="#A84A22" font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="54" y="171">desvio 10</text>
  </g>
  <g fill="#176DA8" font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="54" y="330">desvio 1</text>
  </g>

  <g fill="#F06423" stroke="#FFFFFF" stroke-width="2">
    <circle cx="190" cy="144" r="8"/><circle cx="190" cy="163" r="8"/><circle cx="190" cy="182" r="8"/><circle cx="190" cy="201" r="8"/><circle cx="190" cy="220" r="8"/>
    <circle cx="390" cy="182" r="8"/>
    <circle cx="590" cy="144" r="8"/><circle cx="590" cy="163" r="8"/><circle cx="590" cy="182" r="8"/><circle cx="590" cy="201" r="8"/><circle cx="590" cy="220" r="8"/>
  </g>
  <g fill="#147BDE" stroke="#FFFFFF" stroke-width="2">
    <circle cx="350" cy="345" r="8"/><circle cx="370" cy="345" r="8"/>
    <circle cx="390" cy="286" r="8"/><circle cx="390" cy="305" r="8"/><circle cx="390" cy="324" r="8"/><circle cx="390" cy="343" r="8"/><circle cx="390" cy="362" r="8"/><circle cx="390" cy="381" r="8"/><circle cx="390" cy="400" r="8"/>
    <circle cx="410" cy="345" r="8"/><circle cx="430" cy="345" r="8"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <text x="636" y="161" fill="#A84A22">Desvio maior</text>
    <text x="636" y="186" fill="#516668" font-weight="400">idades mais</text>
    <text x="636" y="209" fill="#516668" font-weight="400">afastadas de 25</text>
    <text x="636" y="319" fill="#176DA8">Desvio menor</text>
    <text x="636" y="344" fill="#516668" font-weight="400">idades mais</text>
    <text x="636" y="367" fill="#516668" font-weight="400">próximas de 25</text>
  </g>

  <path d="M190 439 H590" stroke="#294344" stroke-width="2"/>
  <path d="M190 435 V445 M290 435 V445 M390 435 V445 M490 435 V445 M590 435 V445" stroke="#294344" stroke-width="2"/>
  <g fill="#516668" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="190" y="460">15</text><text x="290" y="460">20</text><text x="390" y="460">25</text><text x="490" y="460">30</text><text x="590" y="460">35</text>
  </g>
  <text x="615" y="445" fill="#516668" font-family="Arial, sans-serif" font-size="14">idade (anos)</text>
  <rect x="28" y="477" width="804" height="31" rx="8" fill="#FFF3E9"/>
  <text x="42" y="498" fill="#89512F" font-family="Arial, sans-serif" font-size="13">Os pontos são fictícios e servem só para visualizar o conceito; não são as idades da pesquisa.</text>
</svg>
